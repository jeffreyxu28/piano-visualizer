<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Song Visualizer</title>
<meta http-equiv="refresh" content="0; url=https://song-visualizer.onrender.com" />
<link rel="canonical" href="https://song-visualizer.onrender.com" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: radial-gradient(ellipse at top, #131729 0%, #06070c 55%);
    color: #f2f4fb;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: 32px;
    max-width: 420px;
  }
  h1 {
    margin: 0;
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    font-weight: 700;
    letter-spacing: -0.01em;
    background: linear-gradient(120deg, #fff 10%, #7c9bff 55%, #b98cff 90%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p { margin: 0; color: #aab0c6; font-size: 0.95rem; line-height: 1.5; }
  .spinner {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 3px solid rgba(124, 155, 255, 0.18);
    border-top-color: #7c9bff;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  a {
    color: #7c9bff;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.9rem;
  }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Song&nbsp;Visualizer</h1>
    <p>Taking you to the live app&hellip;</p>
    <a href="https://song-visualizer.onrender.com">
      Click here if you're not redirected automatically
    </a>
  </div>
  <script>
    window.location.replace("https://song-visualizer.onrender.com");
  </script>
</body>
</html>
